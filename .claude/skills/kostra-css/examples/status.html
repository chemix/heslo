<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>kostra — status</title>
    <link rel="stylesheet" href="../kostra.css" />
    <style>
      body { padding: 2rem; }
      .stack { display: grid; gap: 0.6rem; }
    </style>
  </head>
  <body>
    <h1>Status indicators</h1>
    <p>
      <code>dot--connecting</code> pulzuje přes
      <code>@keyframes kostra-pulse</code>.
    </p>

    <div class="stack">
      <span class="status"><span class="dot dot--idle" aria-hidden></span> Idle</span>
      <span class="status"><span class="dot dot--connecting" aria-hidden></span> Connecting…</span>
      <span class="status"><span class="dot dot--connected" aria-hidden></span> Connected</span>
      <span class="status"><span class="dot dot--disconnected" aria-hidden></span> Disconnected</span>
      <span class="status"><span class="dot dot--error" aria-hidden></span> Error</span>
    </div>

    <h2 style="margin-top: 2rem">S badge</h2>
    <div class="stack">
      <span><span class="badge badge--success">stable</span> Připojeno k produkci</span>
      <span><span class="badge badge--accent">beta</span> Funkce za feature flagem</span>
      <span><span class="badge badge--danger">down</span> CI nedostupné</span>
    </div>
  </body>
</html>
