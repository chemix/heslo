<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>kostra — menu</title>
    <link rel="stylesheet" href="../kostra.css" />
    <style>
      body { padding: 2rem; }
      .host { display: flex; justify-content: flex-end; max-width: 32rem; }
    </style>
  </head>
  <body>
    <h1>Dropdown menu</h1>
    <p>
      Postaveno nad nativním <code>&lt;details&gt;</code> — žádný JS pro
      otevření/zavření. <code>.btn</code> uvnitř <code>.menu__popup</code>
      se chová jako řádek menu.
    </p>

    <div class="host">
      <details class="menu">
        <summary>Možnosti ⋮</summary>
        <div class="menu__popup" role="menu">
          <button class="btn btn--ghost" role="menuitem">Reconnect</button>
          <button class="btn btn--ghost" role="menuitem">Settings</button>
          <button class="btn btn--ghost" role="menuitem" disabled>
            Zablokovaná akce
          </button>
        </div>
      </details>
    </div>
  </body>
</html>
