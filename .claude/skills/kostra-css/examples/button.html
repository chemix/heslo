<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>kostra — buttons</title>
    <link rel="stylesheet" href="../kostra.css" />
    <style>
      body { padding: 2rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Buttons</h1>

    <h2>Variants</h2>
    <div class="row">
      <button class="btn btn--default">Default</button>
      <button class="btn btn--secondary">Secondary</button>
      <button class="btn btn--destructive">Destructive</button>
      <button class="btn btn--outline">Outline</button>
      <button class="btn btn--ghost">Ghost</button>
      <button class="btn btn--link">Link</button>
    </div>

    <h2>Sizes</h2>
    <div class="row">
      <button class="btn btn--outline btn--sm">Small</button>
      <button class="btn btn--outline">Default</button>
      <button class="btn btn--outline btn--lg">Large</button>
    </div>

    <h2>With icon</h2>
    <div class="row">
      <button class="btn btn--default">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Nový záznam
      </button>
      <button class="btn btn--outline btn--icon" aria-label="Obnovit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
      </button>
    </div>

    <h2>Button group</h2>
    <div class="row">
      <div class="btn-group" role="group" aria-label="Rozsah">
        <button class="btn btn--outline">Den</button>
        <button class="btn btn--outline">Týden</button>
        <button class="btn btn--outline">Měsíc</button>
      </div>
    </div>

    <h2>Toolbar with separators</h2>
    <div class="row">
      <div class="btn-group" role="group" aria-label="Nástroje">
        <button class="btn btn--ghost btn--sm">Kopírovat</button>
        <span class="btn-group__separator" aria-hidden></span>
        <button class="btn btn--ghost btn--sm">Vložit</button>
        <span class="btn-group__separator" aria-hidden></span>
        <button class="btn btn--ghost btn--sm">Vymazat</button>
      </div>
    </div>

    <h2>Disabled</h2>
    <div class="row">
      <button class="btn btn--default" disabled>Default</button>
      <button class="btn btn--outline" disabled>Outline</button>
    </div>
  </body>
</html>
