<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>kostra — card</title>
    <link rel="stylesheet" href="../kostra.css" />
    <style>
      body { padding: 2rem; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); max-width: 60rem; }
    </style>
  </head>
  <body>
    <h1>Card</h1>
    <p>Card spravuje vertikální rytmus mezi přímými potomky sám — žádné extra wrappery.</p>

    <div class="grid">
      <div class="card">
        <h3 style="margin: 0">Připojit terminál</h3>
        <p style="margin: 0; color: var(--muted)">
          Token najdeš v <code>.env</code> souboru serveru.
        </p>
        <input class="input input--lg" type="password" placeholder="TOKEN" />
        <button class="btn btn--default">Connect</button>
      </div>

      <div class="card">
        <h3 style="margin: 0">
          Build status
          <span class="badge badge--success" style="margin-left: 0.4rem">stable</span>
        </h3>
        <p style="margin: 0; color: var(--muted)">
          Poslední úspěšný build před 12 minutami.
        </p>
        <span class="status">
          <span class="dot dot--connected" aria-hidden></span> CI online
        </span>
        <div style="display: flex; gap: 0.5rem">
          <button class="btn btn--outline btn--sm">Logs</button>
          <button class="btn btn--ghost btn--sm">Rerun</button>
        </div>
      </div>
    </div>
  </body>
</html>
