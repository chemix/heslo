<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/kostra.css?v=22">
  <link rel="stylesheet" href="/styles.css?v=22">
  <script defer src="/app.js?v=22"></script>
</head>
<body>
  <main class="page-shell">
    <div class="generator">
      <div class="tabbar">
        <div class="tabs" role="tablist" aria-label="Typ hesla">
          <button class="tab" id="tab-random" type="button" role="tab" data-mode="random" aria-selected="true" aria-controls="generatorCard">Random</button>
          <button class="tab" id="tab-memorable" type="button" role="tab" data-mode="memorable" aria-selected="false" aria-controls="generatorCard">Memorable</button>
        </div>
      </div>
      <section class="card" id="generatorCard" role="tabpanel" aria-labelledby="tab-random">

      <div class="result-row">
        <button class="btn btn--outline copy-btn" id="copyBtn" type="button" aria-label="Kopírovat" title="Kopírovat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <div class="input input--lg result-input" id="result" role="button" tabindex="0" aria-label="Vygenerované heslo — kliknutím zkopírujete" title="Kliknutím zkopírujete"></div>
        <div class="generate-group">
          <button class="btn btn--default btn--lg" id="generateBtn" type="button">Generate</button>
          <button class="btn btn--default btn--lg generate-caret" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Další možnosti">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div class="more-menu" id="moreMenu" role="menu" hidden>
            <button class="more-menu__item" id="bulkBtn" type="button" role="menuitem">Generovat 10 hesel do tabulky</button>
          </div>
        </div>
      </div>

      <div id="randomOptions">
        <div class="settings-row">
          <div class="count-row">
            <div class="count-presets-wrap">
              <button class="btn btn--outline btn--icon count-presets-btn" id="lengthPresetsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Předvolby délky">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </button>
              <div class="menu__popup count-presets" id="lengthPresets" role="menu" hidden>
                <button class="btn" type="button" role="menuitem" data-value="8">8 znaků</button>
                <button class="btn" type="button" role="menuitem" data-value="16">16 znaků</button>
                <button class="btn" type="button" role="menuitem" data-value="32">32 znaků</button>
                <button class="btn" type="button" role="menuitem" data-value="64">64 znaků</button>
                <button class="btn" type="button" role="menuitem" data-value="128">128 znaků</button>
              </div>
            </div>
            <input id="length" class="input count-input" type="text" value="32" inputmode="numeric" autocomplete="off" aria-label="Délka hesla">
            <span class="count-unit">znaků</span>
          </div>

          <div class="toggles" aria-label="Znakové sady">
            <label><input id="lowercase" type="checkbox" checked> a-z</label>
            <label><input id="uppercase" type="checkbox" checked> A-Z</label>
            <label><input id="numbers" type="checkbox" checked> 0-9</label>
            <label><input id="symbols" type="checkbox" checked> !@#</label>
          </div>
        </div>
      </div>

      <div id="memorableOptions" hidden>
        <div class="settings-row">
          <div class="count-row">
            <div class="count-presets-wrap">
              <button class="btn btn--outline btn--icon count-presets-btn" id="wordCountPresetsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Předvolby počtu slov">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </button>
              <div class="menu__popup count-presets" id="wordCountPresets" role="menu" hidden>
                <button class="btn" type="button" role="menuitem" data-value="3">3 slova</button>
                <button class="btn" type="button" role="menuitem" data-value="4">4 slova</button>
                <button class="btn" type="button" role="menuitem" data-value="5">5 slov</button>
                <button class="btn" type="button" role="menuitem" data-value="6">6 slov</button>
                <button class="btn" type="button" role="menuitem" data-value="8">8 slov</button>
              </div>
            </div>
            <input id="wordCount" class="input count-input" type="text" value="4" inputmode="numeric" autocomplete="off" aria-label="Počet slov">
            <span class="count-unit">slov</span>
          </div>

          <div class="toggles toggles--dict" aria-label="Slovníky">
            <label><input id="dictNature" type="checkbox" checked> Příroda</label>
            <label><input id="dictSpace" type="checkbox" checked> Vesmír</label>
            <label><input id="dictAnimals" type="checkbox" checked> Zvířata</label>
            <label><input id="dictColors" type="checkbox" checked> Barvy</label>
            <label><input id="pinToggle" type="checkbox" checked> PIN</label>
          </div>
        </div>
      </div>

      <span class="hint" id="copyHint" aria-live="polite"></span>
      </section>

      <section class="card table-card" id="tableCard" role="tabpanel" hidden>
      <div class="table-head">
        <h2>Hesla</h2>
        <button class="btn btn--outline" id="copyTableBtn" type="button">Kopírovat tabulku</button>
      </div>
      <table class="table pw-table">
        <thead>
          <tr><th class="col-num">#</th><th class="col-user">Username</th><th>Password</th><th class="col-action"><span class="sr-only">Akce</span></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button class="btn btn--outline add-row-btn" id="addRowBtn" type="button">+ Přidat řádek</button>
      <span class="hint" id="tableHint" aria-live="polite"></span>
      </section>
    </div>
  </main>
</body>
</html>
