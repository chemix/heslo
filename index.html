<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/kostra.css?v=12">
  <link rel="stylesheet" href="/styles.css?v=12">
  <script defer src="/app.js?v=12"></script>
</head>
<body>
  <main class="page-shell">
    <section class="card" id="generatorCard">
      <h1>Password Generator</h1>

      <div class="result-row">
        <label class="sr-only" for="result">Vygenerované heslo</label>
        <input class="input input--lg result-input" id="result" type="text" readonly spellcheck="false" autocomplete="off" value="">
        <button class="btn btn--outline copy-btn" id="copyBtn" type="button" aria-label="Kopírovat" title="Kopírovat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <div class="controls-row">
        <div class="segmented" role="group" aria-label="Režim">
          <label><input type="radio" name="mode" value="random" checked> Random</label>
          <label><input type="radio" name="mode" value="memorable"> Memorable</label>
        </div>
        <div class="generate-group">
          <button class="btn btn--default btn--lg" id="generateBtn" type="button">Generate</button>
          <button class="btn btn--default btn--lg generate-caret" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Další možnosti">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div class="more-menu" id="moreMenu" role="menu" hidden>
            <button class="more-menu__item" id="bulkBtn" type="button" role="menuitem">Generovat 10 hesel do tabulky</button>
          </div>
        </div>
      </div>

      <div id="randomOptions">
        <label class="field">
          <span>Délka: <strong id="lengthValue">20</strong></span>
          <input id="length" type="range" min="8" max="64" value="20">
        </label>

        <div class="toggles" aria-label="Znakové sady">
          <label><input id="lowercase" type="checkbox" checked> a-z</label>
          <label><input id="uppercase" type="checkbox" checked> A-Z</label>
          <label><input id="numbers" type="checkbox" checked> 0-9</label>
          <label><input id="symbols" type="checkbox" checked> !@#</label>
        </div>
      </div>

      <div id="memorableOptions" hidden>
        <label class="field">
          <span>Počet slov: <strong id="wordCountValue">4</strong></span>
          <input id="wordCount" type="range" min="3" max="8" value="4">
        </label>
      </div>

      <span class="hint" id="copyHint" aria-live="polite"></span>
    </section>

    <section class="card table-card" id="tableCard" hidden>
      <div class="table-head">
        <h2>Hesla</h2>
        <button class="btn btn--outline" id="copyTableBtn" type="button">Kopírovat tabulku</button>
      </div>
      <table class="table pw-table">
        <thead>
          <tr><th class="col-num">#</th><th class="col-user">Username</th><th>Password</th><th class="col-action"><span class="sr-only">Akce</span></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button class="btn btn--outline add-row-btn" id="addRowBtn" type="button">+ Přidat řádek</button>
      <span class="hint" id="tableHint" aria-live="polite"></span>
    </section>
  </main>
</body>
</html>
